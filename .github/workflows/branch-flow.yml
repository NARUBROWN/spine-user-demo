name: Branch Flow

on:
  pull_request_target:
    branches: [preview, rc, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: branch-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  routing:
    name: Enforce PR Direction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 쓰기 권한이 있는 작업에서는 대상 브랜치의 코드만 실행합니다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { evaluate } = require('./scripts/release/branch_flow.cjs');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const result = evaluate({
              head: pr.head.ref,
              base: pr.base.ref,
              sameRepository: pr.head.repo?.full_name === pr.base.repo.full_name,
            });
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: result.context,
              state: result.allowed ? 'success' : 'failure',
              description: result.description.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!result.allowed) core.setFailed(result.description);
