name: Verify user API example

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: go install github.com/NARUBROWN/spine-cli/cmd/spine@v0.4.2
      - run: go mod download
      - run: ./scripts/check.sh
      - run: ./scripts/e2e.sh
