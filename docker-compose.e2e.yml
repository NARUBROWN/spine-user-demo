services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: spine
      MYSQL_DATABASE: spine_demo
    ports:
      - "127.0.0.1:${SPINE_DEMO_E2E_MYSQL_PORT:-13307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pspine"]
      interval: 2s
      timeout: 2s
      retries: 30
